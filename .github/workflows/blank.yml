name: Java with Maven and Node.js CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14' # Node.js 14 is the recommended version for Vue.js 3.x

    - name: Install npm dependencies
      run: npm install

    - name: Build Vue.js
      run: npm run build

    - name: Test Vue.js
      run: npm test

  
